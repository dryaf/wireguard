---
- hosts: servers
  become: yes
  gather_facts: yes
  vars:
    wireguard_mtu: 1280
    client_name: "{{ lookup('env', 'CLIENT_NAME') }}"
    wireguard_allow_legacy_names: true
  tasks:
    - name: Validate local export destination before changing the server
      ansible.builtin.assert:
        that:
          - (inventory_hostname | wireguard_export_host) == inventory_hostname

    - name: Validate client name
      import_tasks: tasks/validate_client_name.yml

    - name: Install transaction helper
      import_tasks: tasks/install_wireguard_manager.yml

    - name: Create private profile staging directory
      tempfile:
        path: /etc/wireguard
        state: directory
        prefix: .client-
      register: client_staging

    - name: Prepare and activate the client before exporting it
      block:
        - name: Stage a profile template without private keys
          template:
            src: templates/client.conf.j2
            dest: "{{ client_staging.path }}/client.template"
            mode: '0600'
          vars:
            client_address: '$WG_CLIENT_ADDRESS'
            client_private_key: {stdout: '$WG_CLIENT_PRIVATE_KEY'}
            server_public_key: {stdout: '$WG_SERVER_PUBLIC_KEY'}
            wireguard_gateway_ip: '$WG_GATEWAY_IP'
            wireguard_port: '$WG_SERVER_PORT'
          diff: false

        - name: Create or resume the client and reconcile the running configuration
          command:
            argv:
              - "{{ ansible_facts.python.executable }}"
              - /usr/local/lib/wireguard-manager/wireguard_manager.py
              - add
              - "{{ client_name }}"
              - --profile-template
              - "{{ client_staging.path }}/client.template"
          register: client_creation
          changed_when: (client_creation.stdout | from_json).changed | default(false)

      always:
        - name: Remove the completed profile staging files
          file:
            path: "{{ client_staging.path }}"
            state: absent

    - name: Create private local archive directory
      file:
        path: "{{ playbook_dir }}/clients"
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false
      run_once: true

    - name: Create private local archive directory for this server
      file:
        path: "{{ playbook_dir }}/clients/{{ inventory_hostname }}"
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false

    - name: Create the local archive file with private permissions before fetching
      file:
        path: "{{ playbook_dir }}/clients/{{ inventory_hostname }}/{{ client_name }}.zip"
        state: touch
        mode: '0600'
        access_time: preserve
        modification_time: preserve
      delegate_to: localhost
      become: false

    - name: Fetch the zipped client configuration
      fetch:
        src: "/etc/wireguard/{{ client_name }}.zip"
        dest: "{{ playbook_dir }}/clients/{{ inventory_hostname }}/{{ client_name }}.zip"
        flat: yes

    - name: Display local archive path
      debug:
        msg: "Client archive: {{ playbook_dir }}/clients/{{ inventory_hostname }}/{{ client_name }}.zip"

    - name: Ensure qrencode is installed
      package:
        name: qrencode
        state: present

    - name: Generate QR code
      command:
        argv:
          - qrencode
          - -t
          - ansiutf8
          - -r
          - "/etc/wireguard/{{ client_name }}.conf"
      register: qr_code
      changed_when: false

    - name: Display QR code
      debug:
        msg: "{{ qr_code.stdout_lines }}"
