[defaults]
inventory = /run/wireguard/inventory.ini
collections_path = /opt/collections
local_tmp = /tmp/ansible/local
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent

[ssh_connection]
ssh_args = -o Compression=no -o ForwardAgent=no -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/run/wireguard/known_hosts
control_path_dir = /tmp/ansible/cp
pipelining = True
