---
- hosts: servers
  become: yes
  gather_facts: yes
  vars:
    wireguard_address: '10.99.0.1/24'
    wireguard_port: 51820
    wireguard_mtu: 1280
    dns_server: '1.1.1.1'
    dnsfilter_enabled: false
    dnsfilter_block_malware: true
    dnsfilter_block_porn: false

  tasks:
    - name: Validate platform and server settings
      ansible.builtin.import_tasks: tasks/validate_server_inputs.yml

    - name: Update and Upgrade all packages
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        upgrade: safe
        force_apt_get: true
        lock_timeout: 300

    # Removed 'iptables-persistent' to avoid conflict with UFW
    - name: Install necessary packages
      ansible.builtin.apt:
        name: "{{ ['wireguard', 'iproute2', 'iptables', 'procps', 'qrencode', 'unattended-upgrades'] + (['update-notifier-common'] if ansible_facts.distribution == 'Ubuntu' else []) }}"
        state: present
        lock_timeout: 300

    - name: Verify that the kernel and security policy allow WireGuard management
      ansible.builtin.command:
        argv: [wg, show, interfaces]
      changed_when: false

    - name: Restrict access to the WireGuard key directory
      file:
        path: /etc/wireguard
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Install transaction helper
      import_tasks: tasks/install_wireguard_manager.yml

    - name: Prepare optional DNS filtering before changing VPN routing
      ansible.builtin.include_tasks: tasks/install_dnsfilter.yml
      when: dnsfilter_enabled

    - name: Initialize combined setup result
      ansible.builtin.set_fact:
        wireguard_setup_complete: false

    - name: Configure the VPN with DNS recovery on failure
      block:
        - name: Apply and verify WireGuard
          ansible.builtin.import_tasks: tasks/configure_wireguard.yml
        - name: Mark successful VPN setup
          ansible.builtin.set_fact:
            wireguard_setup_complete: true
      rescue:
        - name: Remember the VPN setup error
          ansible.builtin.set_fact:
            wireguard_setup_failure: "{{ ansible_failed_result.msg | default('WireGuard setup failed') }}"
        - name: Restore the previous DNS policy if VPN setup failed
          when: dnsfilter_enabled and dnsfilter_succeeded | default(false)
          block:
            - name: Roll back DNS after VPN failure
              ansible.builtin.include_tasks: tasks/rollback_dnsfilter.yml
            - name: Mark completed DNS recovery
              ansible.builtin.set_fact:
                dnsfilter_restored: true
          rescue:
            - name: Report incomplete DNS recovery and preserve its files
              ansible.builtin.fail:
                msg: "WireGuard setup and DNS recovery failed. Recovery files remain in {{ dnsfilter_stage.path }} and the deployment lock remains at /run/wireguard-dnsfilter-setup.lock. {{ wireguard_setup_failure }}"
        - name: Report the unsuccessful VPN setup
          ansible.builtin.fail:
            msg: "{{ wireguard_setup_failure }}"
      always:
        - name: Remove DNS recovery files after success or completed rollback
          ansible.builtin.file:
            path: "{{ dnsfilter_stage.path }}"
            state: absent
          when:
            - dnsfilter_enabled
            - wireguard_setup_complete or dnsfilter_restored | default(false)
            - dnsfilter_stage is defined
        - name: Release this run's DNS deployment lock after success or completed recovery
          ansible.builtin.file:
            path: /run/wireguard-dnsfilter-setup.lock
            state: absent
          when:
            - dnsfilter_enabled
            - dnsfilter_lock_acquired | default(false)
            - wireguard_setup_complete or dnsfilter_restored | default(false)

  handlers:
    - name: Restart unattended-upgrades
      systemd:
        name: unattended-upgrades
        state: restarted
