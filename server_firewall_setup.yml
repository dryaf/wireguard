---
- hosts: servers
  become: yes
  vars:
    # Default WireGuard port, matches other playbooks
    wireguard_port: 51820
    # Use the inventory ssh port or default to 22
    ssh_port: "{{ ansible_port | default(22) }}"

  tasks:
    - name: Install UFW
      apt:
        name: ufw
        state: present
        update_cache: yes

    - name: Apply shared VPN firewall policy
      import_tasks: tasks/wireguard_firewall_rules.yml

    - name: Check UFW status
      command: ufw status verbose
      register: ufw_status
      changed_when: false

    - name: Display UFW status
      debug:
        msg: "{{ ufw_status.stdout_lines }}"
