---
- hosts: servers
  become: yes
  gather_facts: yes
  vars:
    client_name: "{{ lookup('env', 'CLIENT_NAME') }}"
    wireguard_allow_legacy_names: true
  tasks:
    - name: Validate client name
      import_tasks: tasks/validate_client_name.yml

    - name: Install transaction helper
      import_tasks: tasks/install_wireguard_manager.yml

    - name: Revoke the client and then remove its files
      command:
        argv:
          - "{{ ansible_facts.python.executable }}"
          - /usr/local/lib/wireguard-manager/wireguard_manager.py
          - remove
          - "{{ client_name }}"
      register: client_removal
      changed_when: (client_removal.stdout | from_json).changed | default(false)
