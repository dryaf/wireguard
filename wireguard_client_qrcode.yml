- hosts: servers
  become: yes
  gather_facts: yes
  vars:
    client_name: "{{ lookup('env', 'CLIENT_NAME') }}"
    wireguard_allow_legacy_names: true
  tasks:
    - name: Validate client name
      import_tasks: tasks/validate_client_name.yml

    - name: Install qrencode
      apt:
        name: qrencode
        state: present
      when: ansible_os_family == "Debian"

    - name: Generate QR code for the client configuration
      command:
        argv:
          - qrencode
          - -t
          - ansiutf8
          - -r
          - "/etc/wireguard/{{ client_name }}.conf"
      register: qr_code
      changed_when: false

    - name: Display QR code
      debug:
        msg: "{{ qr_code.stdout_lines }}"

