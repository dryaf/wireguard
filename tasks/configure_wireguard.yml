---
- name: Initialize or recover the server key under the shared lock
  command:
    argv:
      - "{{ ansible_facts.python.executable }}"
      - /usr/local/lib/wireguard-manager/wireguard_manager.py
      - initialize-key
  register: server_key_initialization
  changed_when: (server_key_initialization.stdout | from_json).changed | default(false)

- name: Read existing private key
  slurp:
    src: /etc/wireguard/privatekey
  register: existing_private_key
  no_log: true

- name: Set private key variable
  set_fact:
    server_priv_key_final: "{{ existing_private_key.content | b64decode }}"
  no_log: true

- name: Ensure ip forwarding is set up (System persistence)
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop:
    - { key: 'net.ipv4.ip_forward', value: 1 }
    - { key: 'net.ipv6.conf.all.forwarding', value: 1 }

- name: Enable unattended upgrades
  template:
    src: templates/unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    mode: '0644'
  notify:
    - Restart unattended-upgrades

- name: Configure periodic updates
  copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

- name: Create private staging directory for this setup run
  tempfile:
    path: /etc/wireguard
    state: directory
    prefix: .apply-
  register: wireguard_staging

- name: Stage the new interface configuration
  template:
    src: templates/wg0.conf.j2
    dest: "{{ wireguard_staging.path }}/wg0.conf"
    owner: root
    group: root
    mode: '0600'
  vars:
    wireguard_existing_peers: ''
  no_log: true
  diff: false

- name: Initialize setup result
  set_fact:
    wireguard_apply_result: null

- name: Schedule configuration apply independently of this SSH connection
  command:
    argv:
      - systemd-run
      - "--unit=wireguard{{ wireguard_staging.path | basename }}"
      - --on-active=2s
      - --timer-property=AccuracySec=1s
      - --property=Type=oneshot
      - --property=TimeoutStartSec=300
      - --collect
      - "{{ ansible_facts.python.executable }}"
      - /usr/local/lib/wireguard-manager/wireguard_manager.py
      - apply
      - "{{ wireguard_staging.path }}/wg0.conf"
      - --result
      - "{{ wireguard_staging.path }}/result.json"

- name: Wait for the server-side operation through temporary connection loss
  include_tasks: tasks/wait_for_wireguard_apply.yml
  loop: "{{ range(70) | list }}"
  loop_control:
    loop_var: wireguard_wait_attempt

- name: Require successful server-side configuration apply
  assert:
    that:
      - wireguard_apply_result is not none
      - wireguard_apply_result.ok
    fail_msg: "{{ (wireguard_apply_result | default({}, true)).error | default('No setup result received; inspect the private staging directory on the server.') }}"

- name: Remove completed private staging files
  file:
    path: "{{ wireguard_staging.path }}"
    state: absent

- name: Check WireGuard server status
  command: wg show wg0
  register: wireguard_status
  ignore_errors: true
  changed_when: false

- name: Display WireGuard server status
  debug:
    var: wireguard_status.stdout_lines

- name: Fail if WireGuard server is not running
  fail:
    msg: "WireGuard server is not running correctly."
  when: wireguard_status.rc != 0
