---
- hosts: servers
  become: yes
  
  # --- PRE-TASKS: Prepare System ---
  pre_tasks:
    - name: Validate platform and ports before applying hardening roles
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution in ['Debian', 'Ubuntu']
          - ansible_facts.service_mgr == 'systemd'
          - (ssh_port | wireguard_number(1, 65535)) > 0
          - (wireguard_port | wireguard_number(1, 65535)) > 0
          - ansible_user is defined
          - ansible_user is match('^[A-Za-z_][A-Za-z0-9_.-]*$')

    - name: Ensure Apt Cache is updated
      apt:
        update_cache: yes
        cache_valid_time: 3600
      register: apt_result
      until: apt_result is success
      retries: 5
      delay: 5
      when: ansible_os_family == "Debian"

  collections:
    - devsec.hardening
  roles:
    - role: devsec.hardening.os_hardening
    - role: devsec.hardening.ssh_hardening
      vars:
        ssh_server_ports: ["{{ ansible_port | default(22) | string }}"]
        ssh_server_password_login: false
        sshd_authenticationmethods: publickey
        ssh_permit_root_login: "{{ 'prohibit-password' if ansible_user == 'root' else 'no' }}"
        ssh_allow_users: "{{ ansible_user }}"
        ssh_client_alive_interval: 300
        ssh_client_alive_count: 5
        ssh_max_auth_retries: 3

  vars:
    wireguard_port: 51820
    ssh_port: "{{ ansible_port | default(22) }}"
    sysctl_overwrite:
      net.ipv4.ip_forward: 1
      net.ipv6.conf.all.forwarding: 1

  tasks:
    # --- CRITICAL FIX: Remove Conflicting Firewall Manager ---
    - name: Remove conflicting iptables-persistent packages
      package:
        name: ['iptables-persistent', 'netfilter-persistent']
        state: absent

    - name: Remove stale iptables state files (prevents overwrite on boot)
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/iptables/rules.v4
        - /etc/iptables/rules.v6

    - name: Install Dependencies (Fail2Ban, UFW)
      package:
        name: ['fail2ban', 'python3-systemd', 'ufw']
        state: present

    - name: Configure Fail2Ban to protect SSH
      copy:
        dest: /etc/fail2ban/jail.local
        content: |
          [sshd]
          enabled = true
          port = {{ ansible_port | default(22) }}
          filter = sshd
          backend = systemd
          maxretry = 3
          bantime = 1h
      notify: Restart fail2ban

    - name: Validate Fail2Ban configuration before starting it
      command: fail2ban-client -t
      changed_when: false

    - name: Ensure Fail2Ban is started and enabled
      systemd:
        name: fail2ban
        enabled: yes
        state: started

    # --- IP Forwarding Fixes ---
    - name: Force Enable IP Forwarding (IPv4)
      sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        state: present
        reload: yes
        sysctl_file: /etc/sysctl.d/99-vpn-forwarding.conf

    - name: Force Enable IP Forwarding (IPv6)
      sysctl:
        name: net.ipv6.conf.all.forwarding
        value: '1'
        state: present
        reload: yes
        sysctl_file: /etc/sysctl.d/99-vpn-forwarding.conf

    - name: Apply shared VPN firewall policy
      import_tasks: tasks/wireguard_firewall_rules.yml

  handlers:
    - name: Restart fail2ban
      systemd:
        name: fail2ban
        state: restarted
