---
- name: Check WireGuard Internet access after upgrades or reboot
  hosts: servers
  become: true
  gather_facts: false
  tasks:
    - name: Collect server diagnostics without changing configuration or services
      ansible.builtin.script:
        cmd: files/wireguard_diagnostics.py
        executable: /usr/bin/python3
      register: vpn_diagnostics
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Display the complete report, including checks after a failure
      ansible.builtin.debug:
        msg: "{{ vpn_diagnostics.stdout_lines | default([]) }}"

    - name: Require successful server checks
      vars:
        vpn_failed_checks: >-
          {{ vpn_diagnostics.stdout_lines | default([]) | select('match', '^\[FAIL\]') | list }}
        vpn_diagnostic_errors: >-
          {{ vpn_diagnostics.stderr_lines | default([]) | reject('match', '^Shared connection to .* closed\.\s*$') | list }}
      ansible.builtin.assert:
        that: vpn_diagnostics.rc | default(1) == 0
        fail_msg: |-
          VPN checks failed (diagnostic exit code {{ vpn_diagnostics.rc | default('unavailable') }}).
          {% if vpn_failed_checks | length > 0 %}
          {{ vpn_failed_checks | join('\n') }}
          Review the corresponding Next hints in the complete report above.
          {% else %}
          The diagnostic did not report any [FAIL] findings; it may have failed to start or stopped unexpectedly.
          {{ vpn_diagnostics.stdout | default('No diagnostic output available.', true) }}
          {{ vpn_diagnostic_errors | join('\n') }}
          {{ vpn_diagnostics.msg | default('') }}
          {% endif %}
        success_msg: Server checks passed; review warnings and verify Internet access from a connected VPN client.
